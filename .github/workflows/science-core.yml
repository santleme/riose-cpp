name: Scientific core

on:
  push:
    paths:
      - 'engine/campo-core/**'
      - 'src/science-core.ts'
      - 'scripts/build-wasm.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'training/data/**'
      - 'training/growth/**'
      - '.github/workflows/science-core.yml'
  pull_request:
    paths:
      - 'engine/campo-core/**'
      - 'src/science-core.ts'
      - 'scripts/build-wasm.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'training/data/**'
      - 'training/growth/**'
      - '.github/workflows/science-core.yml'

jobs:
  native-and-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: cargo fmt --check --manifest-path engine/campo-core/Cargo.toml
      - run: cargo test --manifest-path engine/campo-core/Cargo.toml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: npm run test:wasm
      - run: python -m unittest training.data.test_ingest_nellore_trough -v
      - run: python -m unittest training.data.test_audit_nellore_shade -v
      - run: python -m json.tool training/data/datasets.json > /dev/null
      - run: python -m json.tool training/data/reports/nellore-shade-access-2026-10.json > /dev/null
